# Waits until netd reports the network configured (at most 15 s), so the
# login prompt and anything else `after = ["network"]` start online.
# On timeout it fails, which init shows in `initctl status network`, and
# the services after it start anyway.
description = "Wait for the network"
type = "oneshot"
exec = ["/usr/bin/myos-net", "wait", "--timeout", "15"]
after = ["netd"]
