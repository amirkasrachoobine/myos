# Login prompt on the serial console (QEMU's -nographic / console=ttyS0).
description = "Serial console login"
exec = ["/sbin/getty", "-L", "115200", "ttyS0", "vt100"]
restart = "always"
# The prompt appears once the network is up (network.toml waits for netd,
# at most 15 s), so you log in to a configured system.
after = ["network"]
# getty becomes the login shell, and interactive shells ignore SIGTERM;
# a hangup is what logs a terminal session out.
stop_signal = "HUP"
stop_timeout = 2
